    <script>
        // --- DATA CONSTANTS ---
        const storyPages = [
            { 
                image: './assets/image1.jpg', 
                title: 'Uma Terra Antiga', 
                text: `Bem-vindo a uma viagem no tempo pela Península Ibérica. Antes dos reinos e das nações, esta terra foi o lar de povos cujas histórias estão gravadas na pedra e na paisagem.<br><br>
                Desde os primórdios da ocupação humana, a Península Ibérica afirmou-se como um território de confluência cultural, um mosaico geográfico e humano moldado por vagas sucessivas de povos e influências. A sua posição estratégica, como ponte entre o Atlântico e o Mediterrâneo e entre a Europa e África, tornou-a um palco privilegiado para o desenvolvimento de sociedades complexas, muito antes da chegada das legiões romanas.<br><br>
                Vamos analisar as contribuições tecnológicas, sociais e culturais cumulativas dos seus primeiros habitantes. Partindo das comunidades recoletoras do Paleolítico, passando pela revolução agropastoril do Neolítico e culminando nas sofisticadas sociedades da Idade dos Metais, como os Iberos e os Celtas, traçaremos um percurso que revela uma notável capacidade de inovação e adaptação.<br><br>
                A identidade peninsular foi forjada não apenas através de uma longa e rica evolução interna, mas também pela absorção seletiva de influências externas significativas. Este processo criou uma base cultural e social resiliente, que, longe de ser uma tábua rasa, interagiu profundamente com a posterior conquista romana, moldando a singularidade da civilização que daí emergiu.<br><br>
                Vamos descobrir os seus segredos!` 
            },
            { 
                image: './assets/image2.jpg', 
                title: 'A Centelha da Civilização', 
                text: `As fundações da história peninsular foram lançadas pelas suas primeiras comunidades. A longa jornada desde um modo de vida recoletor e nómada até à estabilidade da produção de alimentos representou a primeira grande transformação social e tecnológica. A transição para a agricultura, iniciada há cerca de 6.000 anos, não só alterou a relação do ser humano com o meio, mas também estabeleceu a base sobre a qual todas as sociedades subsequentes foram construídas.<br><br>
                As primeiras comunidades humanas que habitaram a Península Ibérica viviam num estado de nomadismo, deslocando-se em clãs em busca de sustento. A sua subsistência dependia inteiramente do que a Natureza lhes proporcionava, através de estratégias baseadas na caça de animais de diferentes portes, na pesca e na recoleção de frutos, sementes e raízes. Esta economia recoletora exigia um profundo conhecimento dos ciclos sazonais e das rotas migratórias dos animais. O desenvolvimento destas comunidades foi impulsionado por duas inovações tecnológicas cruciais:<br><br>
                <b>- O domínio do fogo:</b> A capacidade de produzir e controlar o fogo representou uma autêntica revolução. Permitiu cozinhar os alimentos, o que teve consequências fisiológicas importantes, mas também serviu para aquecer, iluminar as grutas, afastar predadores e endurecer as pontas de madeira das suas armas.<br><br>
                <b>- O fabrico de instrumentos:</b> Utilizando pedra lascada, osso e madeira, estes primeiros grupos fabricavam uma variedade de ferramentas essenciais para a sua sobrevivência. Bifaces, arpões, anzóis e agulhas eram utilizados para cortar carne, pescar, tratar peles e coser vestuário, demonstrando uma crescente sofisticação técnica.<br><br>
                Para além da luta pela sobrevivência, estas comunidades desenvolveram formas complexas de expressão simbólica. A arte rupestre, encontrada em locais emblemáticos como as grutas de Altamira (Espanha) e os abrigos de Vila Nova de Foz Coa (Portugal), é o testemunho mais eloquente. Representando sobretudo animais e cenas de caça, acredita-se que esta arte desempenhava uma função mágica e religiosa, com o intuito de garantir o sucesso nas caçadas e proteger o grupo.` 
            },
            { 
                image: './assets/image3.jpg', 
                title: 'Gigantes de Pedra', 
                text: `Há cerca de 6.000 anos, um aquecimento geral do clima na Península Ibérica permitiu o aparecimento de novas espécies vegetais e animais, catalisando uma mudança fundamental. As comunidades começaram a transitar de uma economia recoletora para uma economia produtora, com o surgimento da agricultura e da domesticação de animais. Esta transformação levou ao abandono gradual do nomadismo e à sedentarização, com a construção dos primeiros aldeamentos em locais fixos. A sedentarização foi acompanhada por um notável avanço tecnológico, que respondeu às novas necessidades de uma sociedade agropastoril:<br><br>
                <b>- Novos instrumentos de pedra polida:</b> Para trabalhar a terra, desenvolveram-se ferramentas mais eficazes, como enxadas, foices e os primeiros arados, que permitiram um melhor aproveitamento dos solos.<br>
                <b>- A Olaria e a Cestaria:</b> A necessidade de armazenar cereais e outros alimentos impulsionou o desenvolvimento da olaria (vasos de cerâmica) e da cestaria, essenciais para a conservação dos excedentes.<br>
                <b>- A Tecelagem:</b> Com a domesticação de animais como a ovelha, a tecelagem surgiu como uma nova atividade para a produção de tecidos e vestuário, utilizando teares primitivos.<br>
                <b>- A invenção da roda:</b> Esta inovação transformou completamente os transportes, facilitando o movimento de bens e produtos e potenciando as trocas entre comunidades.<br><br>
                A crescente complexidade social e religiosa das comunidades agropastoris manifestou-se na construção de monumentos com grandes pedras, um fenómeno conhecido como <b>megalitismo</b>. Estas construções, que exigiam um esforço coletivo e uma organização social considerável, serviam como espaços funerários ou como locais de culto ligados às forças da Natureza, das quais a agricultura dependia vitalmente:<br><br>
                <b>Menires:</b> grandes pedras isoladas, cravadas verticalmente no solo. Acredita-se que estavam associadas a cultos agrários e de fertilidade, dedicados à Natureza.<br>
                <b>Antas ou Dólmenes:</b> construções funerárias coletivas, formadas por grandes pedras verticais (esteios) que sustentam uma laje horizontal (tampa), formando uma câmara onde eram depositados os mortos juntamente com os seus pertences (armas, adornos, cerâmica).<br>
                <b>Cromeleques:</b> conjuntos de menires dispostos em círculo. A sua função está provavelmente ligada ao culto da Natureza e à observação dos astros, servindo como santuários ao ar livre.` 
            },
            { 
                image: './assets/image4.jpg', 
                title: 'Um Mosaico de Povos', 
                text: `O domínio da metalurgia representou um salto tecnológico que acelerou a complexificação social, acentuou a diferenciação cultural e consolidou o poder de elites guerreiras e políticas. A riqueza mineral da Península Ibérica, em particular os seus depósitos de cobre, estanho, prata e ouro, não só impulsionou o desenvolvimento interno, mas também atraiu povos comerciantes do Mediterrâneo, como Fenícios, Gregos e Cartagineses, que foram cruciais para moldar a diversidade étnica e cultural da Península na era pré-romana.<br>
                A Península era um caldeirão de culturas. Os Iberos, no sul e leste; os Celtas, no norte e oeste. Do seu encontro nasceram os Celtiberos e, entre eles, os bravos Lusitanos, um povo de pastores e guerreiros que amava a liberdade acima de tudo.<br><br>

                <h3 class="font-bold text-amber-800 text-lg">4.1 Os Iberos: Urbanismo e Influência Mediterrânica</h3>
                Os Iberos, provavelmente originários do Norte de África, estabeleceram-se no sul e leste da Península, numa região aberta às influências mediterrânicas. Caracterizados fisicamente como sendo morenos e de estatura média, desenvolveram uma das culturas mais avançadas do território. A sua organização social era notavelmente sofisticada. Viviam em povoações fortificadas, conhecidas como "oppida", que demonstram um elevado nível de planeamento urbano, estabelecendo uma base de assentamento que os Romanos, mais tarde, iriam adaptar e expandir. A sociedade ibera era estratificada, com uma clara divisão entre governantes, nobres, artesãos e escravos. No campo tecnológico, dominaram a metalurgia do cobre e do bronze e exploraram intensivamente as minas de prata. Por influência do contacto com os Gregos, adotaram o cultivo da vinha e da oliveira. A sua arte, de grande qualidade e beleza, é exemplificada pela célebre "Dama de Elche", um busto que revela uma forte influência estilística grega.<br><br>

                <h3 class="font-bold text-amber-800 text-lg">4.2 Os Celtas: Cultura Castreja e o Domínio do Ferro</h3>
                Provenientes da Europa Central, os Celtas fixaram-se predominantemente no noroeste da Península Ibérica. Fisicamente, eram descritos como altos, de pele clara, louros e de olhos claros. Este povo aguerrido introduziu uma tecnologia que representou uma vantagem disruptiva sobre os povos locais: o domínio do ferro. Com este metal, fabricaram armas mais resistentes e ferramentas agrícolas mais duradouras, conferindo-lhes uma superioridade militar e económica relativa às tecnologias da Idade do Bronze. O seu modelo de povoamento, conhecido como "cultura castreja", baseava-se em povoados fortificados situados no cimo de montes, os castros ou citânias. Estes locais, como a imponente Citânia de Briteiros, estavam rodeados por muralhas defensivas e organizados em clãs, refletindo uma sociedade guerreira e bem estruturada para a defesa do seu território. A fusão gradual entre Celtas e Iberos em zonas de contacto deu origem aos Celtiberos.<br><br>

                <h3 class="font-bold text-amber-800 text-lg">4.3 Intercâmbio Cultural: Fenícios, Gregos e Cartagineses</h3>
                Entre os séculos XI e III a.C., a Península Ibérica tornou-se um ponto de atração para os povos mais desenvolvidos do Mediterrâneo. Atraídos pelas suas vastas riquezas minerais — ouro, prata, cobre e estanho —, Fenícios, Gregos e Cartagineses estabeleceram feitorias comerciais e colónias ao longo da costa sul e leste. Este contacto não foi meramente comercial; trouxe consigo inovações que enriqueceram permanentemente a cultura dos povos peninsulares.<br>
                As suas contribuições mais duradouras podem ser sintetizadas da seguinte forma:<br>
                <b>1. Fenícios:</b> Foram responsáveis pela introdução da escrita alfabética, um sistema fonético muito mais simples e acessível que os sistemas de escrita anteriores, revolucionando a comunicação e a administração.<br>
                <b>2. Gregos:</b> Generalizaram a utilização da moeda nas trocas comerciais, substituindo progressivamente a economia de troca direta e facilitando o comércio a longa distância.<br>
                <b>3. Cartagineses:</b> Divulgaram a técnica de conservação de alimentos com sal, um método crucial para a preservação de peixe e carne, que permitiu o armazenamento de alimentos por longos períodos e impulsionou o comércio de produtos alimentares.<br><br>

                <h3 class="font-bold text-amber-800 text-lg">4.4 Os Lusitanos: Símbolo da Resistência Peninsular</h3>
                Desta complexa mescla de povos autóctones e influências mediterrânicas surgiu uma das tribos mais resilientes e emblemáticas da Península: os Lusitanos, que se tornariam o maior obstáculo à expansão romana.<br>
                Os Lusitanos, um poderoso conjunto de tribos de provável origem indo-europeia e possivelmente pré-celta, transcenderam o seu estatuto tribal para se tornarem o principal arquétipo da resistência à expansão romana. O seu território, estrategicamente localizado entre os rios Douro e Tejo, era caracterizado por um relevo montanhoso que souberam utilizar com mestria para se oporem ao mais poderoso exército da Antiguidade. A sua feroz oposição, que durou décadas, transformou-os num símbolo duradouro da luta pela independência.<br><br>

                <b>4.4.1 Sociedade e Modo de Vida</b><br>
                Graças aos relatos do geógrafo grego Estrabão, possuímos um retrato vívido dos costumes lusitanos. A sua sociedade, embora simples, era regida por tradições bem definidas e adaptada a um ambiente austero.<br>
                <b>Dieta e Hábitos Sociais:</b> A sua alimentação baseava-se em produtos locais, como o pão feito de bolota moída. Bebiam uma espécie de cerveja, pois o vinho era raro e consumido apenas em festins familiares. Nestes banquetes, sentavam-se em bancos ao longo das paredes, e as iguarias eram partilhadas enquanto dançavam ao som de flautas e trombetas.<br>
                <b>Aparência e Vestuário:</b> Usavam os cabelos compridos e soltos, como as mulheres, prendendo-os com uma faixa na testa durante os combates. Praticavam exercícios físicos como o pugilato e as corridas, preparando-se desde cedo para a guerra.<br><br>

                <b>4.4.2 Táticas e Equipamento Militar</b><br>
                A reputação militar dos Lusitanos não assentava em grandes exércitos organizados, mas sim na sua extraordinária proficiência em táticas de guerrilha. Estrabão descreve-os como "hábeis em armar emboscadas e descobrir pistas", destacando a sua agilidade e rapidez. Entravam em combate soltando cânticos guerreiros e fazendo uma grande algazarra para infundir terror no inimigo. Evitavam o confronto direto, preferindo emboscadas e ataques surpresa, e demonstravam grande adaptabilidade, chegando a transportar um segundo soldado a pé na garupa dos seus cavalos. O seu equipamento era leve e adaptado a este estilo de combate:<br>
                <i>“Usam um pequeno escudo de dois pés de diâmetro, côncavo para diante (...). Usam também um punhal ou um gládio. A maior parte dos guerreiros veste couraças de linho e apenas alguns têm cotas de malha (...), usando geralmente elmos de fibras. Os peões (...) estão armados com lanças de ponta de bronze.”</i> — Estrabão, Geografia 3.3.6.<br><br>

                <b>4.4.3 A Luta Contra Roma e a Liderança de Viriato</b><br>
                A chegada dos Romanos e a sua progressiva conquista da Península forçaram as tribos lusitanas, habituadas a rivalidades internas, a unirem-se contra um inimigo comum. Neste contexto, emergiu a figura de Viriato, um líder carismático e um estratega genial. Recusando-se a aceitar a rendição, Viriato infligiu uma série de derrotas humilhantes a múltiplos generais romanos, como Caio Vetílio, Caio Pláucio e Fábio Máximo. A sua liderança transformou uma resistência dispersa numa campanha militar organizada e eficaz.<br>
                O sucesso de Viriato foi tal que, em 140 a.C., forçou Roma a negociar um tratado que reconhecia a autonomia lusitana. No entanto, o Senado romano, humilhado, repudiou o acordo e reiniciou a guerra. Incapaz de derrotá-lo em batalha, o general romano Servílio Cipião recorreu à traição. Em 139 a.C., Viriato enviou três dos seus homens de confiança — Audas, Ditalco e Minuros — para negociar a paz. Subornados por Cipião com promessas de riqueza, os emissários regressaram ao acampamento e assassinaram o seu líder enquanto este dormia. A morte de Viriato marcou o fim da resistência organizada e abriu caminho para a inevitável e profunda transformação que se seguiu: a romanização.` 
            },
            { 
                image: './assets/image5.jpg', 
                title: 'A Chegada das Águias', 
                text: `Em 218 a.C., um novo poder chegou pelo mar. As legiões de Roma desembarcaram, atraídas pelas ricas minas e pela posição estratégica da Península. A conquista seria longa e difícil, marcada pela feroz resistência dos povos locais, como os Lusitanos liderados por Viriato.<br>
                A romanização foi um processo transformador e multidimensional que se estendeu por mais de seis séculos. Foi muito além da simples conquista militar, redefinindo permanentemente as estruturas sociais, económicas, políticas e culturais da Península. Roma não se limitou a subjugar os povos peninsulares; integrou-os numa nova ordem territorial e civilizacional, cuja influência perdura até aos dias de hoje.<br><br>
                
                <h3 class="font-bold text-amber-800 text-lg">5.1 As Motivações e Fases da Conquista</h3>
                A conquista romana da Península Ibérica, iniciada em 218 a.C. no contexto da Segunda Guerra Púnica contra Cartago, durou cerca de 200 anos, terminando apenas em 19 a.C. As motivações de Roma eram tanto estratégicas como económicas:<br>
                <b>Controlo estratégico do Mediterrâneo:</b> A posição geográfica da Península era vital para controlar a ligação ao Atlântico e o acesso ao Norte de África.<br>
                <b>Riquezas naturais:</b> O território era rico em metais preciosos, como ouro e prata, e outros recursos minerais que eram essenciais para a economia romana.<br>
                O processo de conquista foi desigual. No sul e no litoral mediterrânico, onde os povos já estavam habituados ao contacto com outras civilizações, a resistência foi fraca. No centro e norte, no entanto, os Romanos enfrentaram uma oposição feroz, simbolizada pela luta dos Lusitanos e, mais tarde, dos Cântabros e Ástures.<br><br>

                <h3 class="font-bold text-amber-800 text-lg">5.2 Os Pilares da Romanização</h3>
                A profunda influência de Roma foi assegurada por vários agentes de transformação cultural que impuseram um novo modo de vida em todo o território.<br>
                <b>Urbanismo e Infraestruturas:</b> Os Romanos fundaram inúmeras cidades planeadas à sua imagem, como Bracara Augusta (Braga) e Pax Iulia (Beja). Estas cidades eram centros administrativos e económicos, dotados de edifícios públicos como fóruns, termas, teatros e aquedutos. Para ligar estes centros, construíram uma vasta e duradoura rede de estradas e pontes, que facilitou o comércio, a comunicação e o movimento das legiões.<br>
                <b>O Latim e o Direito:</b> A imposição do latim como língua oficial foi um dos mais poderosos fatores de unificação. Tornou-se a língua da administração, do comércio e da cultura, dando origem, mais tarde, às línguas românicas da Península, incluindo o português. Igualmente importante foi a implementação do direito romano, um conjunto de leis que regulava a vida pública e privada, estabelecendo uma base legal comum para todo o território.<br>
                <b>Desenvolvimento Económico:</b> Os Romanos intensificaram e organizaram em larga escala o cultivo da vinha e da oliveira, já presentes na Península por influência grega, e expandiram a produção de trigo. Organizaram a exploração mineira em larga escala e desenvolveram indústrias artesanais, como a olaria, a tecelagem e a salga de peixe, integrando a economia peninsular no vasto mercado do Império.` 
            },
            { 
                image: './assets/image6.jpg', 
                title: 'O Legado de Roma', 
                text: `Após a conquista, veio a romanização. Estradas, pontes, cidades, o latim, o direito e, eventualmente, uma nova fé, o Cristianismo. O legado de Roma moldou a Península de forma tão profunda que as suas fundações perduram até hoje no nosso idioma, leis e cultura.<br><br>
                Inicialmente, os Romanos introduziram o seu panteão de deuses (politeísmo) e o culto ao imperador, que funcionava como um elo de lealdade política em todo o Império. No entanto, uma nova religião monoteísta, o Cristianismo, começou a difundir-se a partir da Palestina. Baseado em princípios como o amor ao próximo, a igualdade e a crença na vida eterna, o Cristianismo foi inicialmente perseguido, pois os seus seguidores recusavam-se a prestar culto ao imperador. Contudo, a sua popularidade cresceu de forma constante. O ponto de viragem ocorreu em 313 d.C., quando o imperador Constantino, através do Édito de Milão, concedeu liberdade de culto aos cristãos. Finalmente, em 380 d.C., o imperador Teodósio, com o Édito de Tessalónica, tornou o Cristianismo a religião oficial do Império Romano, marcando o fim da religião politeísta e consolidando uma nova matriz cultural e espiritual que definiria a Idade Média.<br><br>
                Com a consolidação do domínio romano e a cristianização do império, a Península Ibérica estava pronta para entrar numa nova fase da sua história, mas as fundações deixadas pelos seus primeiros povos nunca seriam totalmente apagadas.<br><br>
                Em suma, a Península Ibérica pré-romana era um mosaico vibrante de culturas, caracterizado por um notável grau de desenvolvimento tecnológico e social. Desde as primeiras inovações das comunidades recoletoras, como o domínio do fogo, até à complexa organização urbana dos Iberos e à mestria metalúrgica dos Celtas, os povos que habitaram este território construíram sociedades resilientes e dinâmicas, capazes tanto de evolução interna como de assimilação de influências externas.<br>
                Apesar da profundidade da romanização, que redefiniu a língua, o direito, a religião e a paisagem da Península, o legado destes primeiros povos persistiu. Elementos da cultura pré-romana sobreviveram, integrando-se subtilmente na nova ordem. Topónimos de origem celta com o sufixo -briga (cidade fortificada), como Conímbriga, ainda marcam a geografia, enquanto tradições rurais, práticas agropastoris e narrativas do folclore ecoam costumes ancestrais. A resistência feroz dos Lusitanos, em particular, deixou uma marca indelével no imaginário coletivo, tornando-se um símbolo da identidade e da luta pela autonomia.<br><br>
                A história da Península Ibérica é, em última análise, uma narrativa de contínua sobreposição de camadas culturais. Cada nova civilização não apagou completamente a anterior, mas construiu sobre as suas fundações. A herança dos povos pré-romanos constitui o substrato profundo sobre o qual a cultura romana, e mais tarde outras, se assentaram, criando a identidade rica e multifacetada que viria a definir Portugal e Espanha.` 
            }
        ];

        const modules = [
            { id: 'modulo1', title: 'Módulo 1: Comunidades Pré-Históricas', icon: '🗿', color: 'from-amber-600 to-yellow-700', content: { intro: 'Das grutas aos primeiros aldeamentos, a jornada do Homem na Península Ibérica foi marcada por incríveis adaptações e inovações.', sections: [ { title: 'De Recoletores a Produtores', items: [ { emoji: '🏃‍♂️', title: 'Caçadores-Recoletores', text: 'Eram nómadas, viviam da caça, pesca e recolha de frutos. Usavam instrumentos de pedra lascada e dominavam o fogo, uma descoberta crucial para cozinhar, aquecer e proteger-se.' }, { emoji: '🏠', title: 'Agropastoris', text: 'Com o fim da Idade do Gelo, tornaram-se sedentários. Desenvolveram a agricultura e a pastorícia, construindo os primeiros aldeamentos. Criaram novos instrumentos como a cerâmica, a tecelagem e a roda.' } ] }, { title: 'Construções Megalíticas: A Arte das Grandes Pedras', text: 'Estas comunidades desenvolveram newas manifestações artísticas e religiosas, construindo monumentos com grandes pedras.', items: [ { emoji: '🏛️', title: 'Antas ou Dólmenes', text: 'Túmulos coletivos, formados por grandes lajes verticais (esteios) cobertas por uma na horizontal (tampa).' }, { emoji: '⬆️', title: 'Menires', text: 'Grandes pedras isoladas, cravadas verticalmente no solo, provavelmente para cultos à natureza e fertilidade.' }, { emoji: '⭕', title: 'Cromeleques', text: 'Conjunto de menires dispostos em círculo, que funcionavam como santuários ou observatórios astronómicos.' } ] } ], activity: { type: 'problem', image: './assets/image7.jpg', question: 'Qual era a principal função de uma construção megalítica como a da imagem (uma anta ou dólmen)?', scenario: 'As comunidades que se tornaram produtoras desenvolveram newas práticas religiosas e funerárias, construindo monumentos com grandes pedras (megalitos) que tinham propósitos específicos.', options: [ { id: 'A', text: 'Servir de habitação para o chefe da tribo.', correct: false }, { id: 'B', text: 'Armazenar os cereais colhidos.', correct: false }, { id: 'C', text: 'Ser um túmulo para enterrar os mortos da comunidade.', correct: true }, { id: 'D', text: 'Funcionar como posto de vigia e defesa do aldeamento.', correct: false } ], feedback: { correct: 'Correto! As antas ou dólmenes eram monumentos funerários, usados como túmulos coletivos pelas comunidades neolíticas que se tornaram produtoras.', incorrect: 'Incorreto. A resposta certa é que serviam como túmulo. As habitações eram nos aldeamentos e o armazenamento era feito em cerâmica ou celeiros.' } } } },
            { id: 'modulo2', title: 'Módulo 2: A Vida no Paleolítico', icon: '🔥', color: 'from-orange-600 to-red-700', content: { intro: 'Mergulhe numa recriação do dia-a-dia dos nossos antepassados mais antigos. Descubra como os caçadores-recoletores do Paleolítico sobreviviam e se organizavam.', sections: [], activity: { type: 'multiselect', image: './assets/image16.jpg', question: 'Com base na imagem e nas legendas, selecione TODAS as afirmações VERDADEIRAS sobre o modo de vida no Paleolítico:', scenario: 'Esta ilustração retrata um acampamento do Paleolítico. Analise os detalhes para identificar as características corretas deste período.', options: [ { id: 'A', text: 'Viviam em cabanas feitas de peles e ossos, e usavam o fogo para cozinhar e aquecer-se.', correct: true }, { id: 'B', text: 'Os seus instrumentos eram feitos de pedra polida e já praticavam a tecelagem.', correct: false }, { id: 'C', text: 'Protegiam-se do frio com roupas de peles de animais, cosidas com agulhas de osso.', correct: true }, { id: 'D', text: 'Eram sedentários e já domesticavam animais para obter lã e leite.', correct: false } ], correct: ['A', 'C'], feedback: { correct: 'Excelente! Ambas as afirmações estão corretas. O domínio do fogo, das habitações de peles e as roupas cosidas com agulhas de osso são características marcantes do Paleolítico.', incorrect: 'Reveja a sua resposta. As opções corretas descrevem o uso do fogo, das cabanas e das roupas de pele. A pedra polida, a tecelagem e a domesticação de animais são do Neolítico.' } } } },
            { id: 'modulo3', title: 'Módulo 3: A Revolução do Neolítico', icon: '🌾', color: 'from-emerald-600 to-green-700', content: { intro: 'Explore as grandes transformações do Neolítico. A invenção da agricultura e da pastorícia mudou para sempre a forma como os humanos viviam.', sections: [], activity: { type: 'multiselect', image: './assets/image17.jpg', question: 'A imagem ilustra várias inovações do Neolítico. Selecione TODAS as atividades ou tecnologias que caracterizam este período:', scenario: 'Esta ilustração representa um aldeamento neolítico. Analise as newas tecnologias e atividades que marcaram esta autêntica revolução no modo de vida humano.', options: [ { id: 'A', text: 'A utilização de teares para fabricar tecidos e o uso de cerâmica para cozinhar.', correct: true }, { id: 'B', text: 'A construção de aldeias protegidas e a prática da agricultura.', correct: true }, { id: 'C', text: 'A vida nómada, em busca de frutos e animais para caçar.', correct: false }, { id: 'D', text: 'O uso exclusivo de instrumentos de pedra lascada e a habitação em grutas.', correct: false } ], correct: ['A', 'B'], feedback: { correct: 'Correto! A tecelagem, a cerâmica, a agricultura e a construção de aldeias são todas inovações fundamentais do Neolítico que levaram ao sedentarismo.', incorrect: 'Reveja a sua seleção. As opções corretas apontam para as newas tecnologias como a cerâmica e a tecelagem, e para a prática da agricultura e construção de aldeias. O nomadismo e a pedra lascada são do período anterior.' } } } },
            { id: 'modulo4', title: 'Módulo 4: Povos Pré-Romanos', icon: '🛡️', color: 'from-orange-600 to-amber-700', content: { intro: 'Antes de Roma, a Península era um mosaico de povos com culturas e modos de vida distintos. Conheça os seus protagonistas.', sections: [ { title: 'Iberos, Celtas e o Encontro de Culturas', items: [ { emoji: '☀️', title: 'Iberos', text: 'Originários do Norte de África, ocuparam o Sul e Leste da Península. Eram agricultores e metalurgistas, trabalhando o cobre e o bronze.' }, { emoji: '🌳', title: 'Celtas', text: 'Vindos do Centro da Europa, ocuparam o Noroeste. Eram guerreiros, trabalhavam o ferro e viviam em povoados fortificados no alto de montes (castros).' }, { emoji: '🤝', title: 'Celtiberos', text: 'Da união dos Iberos e Celtas surgiram os Celtiberos, que se organizavam em tribos e viviam em castros.' } ] }, { title: 'Os Lusitanos: A Resistência Feroz', text: 'Uma das tribos celtiberas mais famosas, os Lusitanos dominaram o território entre os rios Douro e Tejo. Eram pastores e guerreiros temíveis, conhecidos pela sua tática de guerrilha. Liderados pelo pastor e estratega Viriato, infligiram pesadas derrotas aos exércitos romanos durante anos, tornando-se um símbolo de resistência à conquista.' } ], activity: { type: 'problem', image: './assets/image8.jpg', question: 'Qual povo, liderado por Viriato, era famoso por viver em castros e resistir ferozmente aos invasores romanos?', scenario: 'Várias tribos habitavam a Península Ibérica. Uma delas, conhecida pela sua bravura e táticas de guerrilha, tornou-se um símbolo da resistência contra Roma.', options: [ { id: 'A', text: 'Fenícios', correct: false }, { id: 'B', text: 'Iberos', correct: false }, { id: 'C', text: 'Lusitanos', correct: true }, { id: 'D', text: 'Gregos', correct: false } ], feedback: { correct: 'Exato! Os Lusitanos, liderados por Viriato, eram famosos pela sua bravura e por viverem em castros, oferecendo uma resistência feroz aos romanos.', incorrect: 'A resposta correta é Lusitanos. Os Fenícios e Gregos eram principalmente povos comerciantes e os Iberos, embora tenham resistido, não são tão associados à liderança de Viriato.' } } } },
            { id: 'modulo7', title: 'Módulo 5: A Romanização', icon: '🏛️', color: 'from-purple-600 to-indigo-700', content: { intro: 'A conquista romana transformou a Península Ibérica para sempre, deixando um legado que perdura até aos dias de hoje.', sections: [ { title: 'A Conquista Romana (início em 218 a.C.)', text: 'Os romanos conquistaram a Península por duas razões principais:', items: [ { emoji: '🗺️', title: 'Controlo Estratégico', text: 'A Península era vital para controlar o Mediterrâneo e o acesso ao Atlântico.' }, { emoji: '💎', title: 'Motivos Económicos', text: 'A terra era rica em metais preciosos como ouro e prata, além de produtos agrícolas.' } ] }, { title: 'Fatores da Romanização', text: 'A romanização foi o processo de adoção da cultura romana pelos povos locais, facilitado por vários fatores:', items: [ { emoji: '🗣️', title: 'Latim', text: 'A língua dos romanos, que deu origem ao português.' }, { emoji: '🛣️', title: 'Rede de Estradas e Pontes', text: 'Ligavam todo o império, facilitando o comércio e o movimento de tropas.' }, { emoji: '⚖️', title: 'Direito Romano', text: 'Um conjunto de leis que se tornou a base da legislação moderna.' }, { emoji: '🏙️', title: 'Cidades e Infraestruturas', text: 'Construção de cidades com teatros, termas, aquedutos e templos.' } ] }, { title: 'A Cristianização', text: 'Inicialmente perseguido, o Cristianismo difundiu-se pelo império. Em 313, o imperador Constantino concedeu liberdade de culto. Em 380, o imperador Teodósio tornou o Cristianismo a religião oficial, marcando profundamente a cultura da Península.' } ], activity: { type: 'problem', image: './assets/image9.jpg', question: 'A imagem de uma ponte romana (como a de Chaves) é um exemplo de qual importante fator da romanização?', scenario: 'Para unificar e administrar o seu vasto império, os Romanos investiram massivamente em construções que facilitavam as comunicações, o comércio e o movimento das suas legiões.', options: [ { id: 'A', text: 'Adoção do Latim.', correct: false }, { id: 'B', text: 'Imposição do Direito Romano.', correct: false }, { id: 'C', text: 'Construção de uma vasta rede de estradas e pontes.', correct: true }, { id: 'D', text: 'A fundação de escolas filosóficas.', correct: false } ], feedback: { correct: 'Isso mesmo! As pontes e estradas romanas foram uma obra de engenharia fundamental para unificar o império, sendo um dos mais visíveis legados da romanização.', incorrect: 'A resposta correta é a construção da rede de estradas e pontes. O Latim e o Direito são legados imateriais, e a filosofia não foi um fator principal da romanização.' } } } },
            { id: 'modulo8', title: 'Módulo 6: Desafio de Identificação', icon: '🖼️', color: 'from-teal-600 to-cyan-700', content: { intro: 'Analise as imagens para distinguir os modos de vida das primeiras comunidades: os caçadores-recoletores nómadas e os agropastoris sedentários.', sections: [], activity: { type: 'problem', image: './assets/image14.jpg', question: 'Observando os documentos na imagem, quais deles representam a comunidade agropastoril, que já praticava a agricultura e a pastorícia?', scenario: 'As imagens de 1 a 6 ilustram diferentes atividades das comunidades pré-históricas. A sua tarefa é agrupar as que correspondem ao modo de vida agropastoril.', options: [ { id: 'A', text: 'Documentos 1, 4 e 5.', correct: false }, { id: 'B', text: 'Documentos 2, 3 e 6.', correct: true }, { id: 'C', text: 'Documentos 1, 2 e 3.', correct: false }, { id: 'D', text: 'Documentos 4, 5 e 6.', correct: false } ], feedback: { correct: 'Correto! Os documentos 2 (armazenamento de cereais), 3 (pastorícia) e 6 (ceifa) mostram atividades de uma comunidade produtora e sedentária.', incorrect: 'Incorreto. A resposta certa é 2, 3 e 6. Os documentos 1, 4 e 5 mostram cenas de caça e um modo de vida mais dependente dos recursos naturais imediatos, típico dos caçadores-recoletores.' } } } },
            { id: 'modulo9', title: 'Módulo 7: Legados do Comércio', icon: '⛵', color: 'from-sky-600 to-blue-700', content: { intro: 'A Península Ibérica foi um ponto de encontro para muitos povos do Mediterrâneo, que trouxeram mais do que apenas mercadorias.', sections: [], activity: { type: 'problem', image: './assets/image8.jpg', question: 'Os Fenícios, um povo comerciante do Mediterrâneo, deixaram um legado muito importante aos povos peninsulares. Qual foi esse legado?', scenario: 'O mapa mostra as rotas e a proveniência de vários povos que visitaram a Península Ibérica, como Fenícios, Gregos e Cartagineses, para comerciar e buscar metais.', options: [ { id: 'A', text: 'A invenção da roda.', correct: false }, { id: 'B', text: 'A transmissão do seu alfabeto.', correct: true }, { id: 'C', text: 'A construção de monumentos megalíticos.', correct: false }, { id: 'D', text: 'A introdução do cavalo.', correct: false } ], feedback: { correct: 'Exato! O alfabeto fenício é um dos maiores legados deste povo, tendo servido de base para o alfabeto grego e, posteriormente, o latino que usamos até hoje.', incorrect: 'A resposta correta é o alfabeto. A roda e os megalitos são muito anteriores, e o cavalo já existia na Península.' } } } },
            { id: 'modulo10', title: 'Módulo 8: Análise do Mapa Imperial', icon: '🗺️', color: 'from-rose-600 to-pink-700', content: { intro: 'Os mapas são documentos históricos valiosos. Aprenda a interpretar um mapa do Império Romano para extrair informações sobre a sua economia.', sections: [], activity: { type: 'problem', image: './assets/image15.jpg', question: 'De acordo com o mapa do Império Romano, qual destas afirmações é confirmada pela legenda e pelas rotas comerciais?', scenario: 'Este mapa representa a extensão máxima do Império Romano no século II, mostrando as suas províncias, rotas comerciais e os principais produtos de cada região.', options: [ { id: 'A', text: 'O exército romano era muito numeroso e disciplinado.', correct: false }, { id: 'B', text: 'As principais riquezas da Península Ibérica (Hispânia) eram ouro, prata, vinho e frutos secos.', correct: true }, { id: 'C', text: 'Os comerciantes romanos dominavam as rotas das sedas da China.', correct: false }, { id: 'D', text: 'Alguns povos resistiram aos romanos, mas foram derrotados.', correct: false } ], feedback: { correct: 'Correto! Ao observar a região da Hispânia no mapa e cruzar com a legenda, vemos claramente os símbolos de ouro, prata, vinho e frutos secos.', incorrect: 'Incorreto. A única afirmação que pode ser verificada diretamente no mapa é sobre as riquezas da Península Ibérica, através da legenda de produtos.' } } } },
            { id: 'modulo11', title: 'Módulo 9: Detetive da História', icon: '✍️', color: 'from-red-600 to-orange-700', content: { intro: 'Atenção aos detalhes! Nem sempre a informação que lemos está correta. Este desafio testa a sua capacidade de identificar erros históricos.', sections: [], activity: { type: 'problem', image: './assets/image10.jpg', question: 'O texto original da fonte continha vários erros históricos. Qual das seguintes frases descreve corretamente os eventos da conquista romana?', scenario: 'A imagem retrata uma batalha entre Romanos e Lusitanos. Um texto que a acompanha na fonte original tem erros. Analise as opções para encontrar a afirmação correta.', options: [ { id: 'A', text: 'O exército dos Lusitanos invadiu a Península Ibérica em 218 a.C.', correct: false }, { id: 'B', text: 'Viriato foi um famoso chefe dos Romanos que lutou contra os Lusitanos.', correct: false }, { id: 'C', text: 'Os Romanos viviam em castros no alto dos montes.', correct: false }, { id: 'D', text: 'Os Lusitanos, liderados por Viriato, eram conhecidos por fazer emboscadas ao exército romano.', correct: true } ], feedback: { correct: 'Muito bem! Esta afirmação está correta. Foram os Romanos que invadiram, Viriato era Lusitano, e os castros eram habitações dos Celtas e Lusitanos. A tática de guerrilha (emboscadas) era a especialidade de Viriato.', incorrect: 'A resposta correta é a D. Foram os Romanos que invadiram a Península em 218 a.C.; Viriato era o líder dos Lusitanos; e os castros eram as fortificações dos Lusitanos, não dos Romanos.' } } } },
            { id: 'modulo12', title: 'Módulo 10: Herança em Imagens', icon: '🌉', color: 'from-lime-600 to-green-700', content: { intro: 'A herança romana está por toda a parte. Consegue associar a descrição correta a cada vestígio do passado?', sections: [], activity: { type: 'problem', image: './assets/image11.jpg', question: 'A imagem mostra quatro exemplos do legado romano. A qual deles corresponde a descrição: "Os romanos construíram uma rede de estradas que cobria o império e que abrangia toda a Península Ibérica"?', scenario: 'Os Romanos deixaram uma herança duradoura na Península Ibérica, visível em construções, na língua e na organização do território, como mostram os quatro documentos.', options: [ { id: 'A', text: 'Às ruínas da cidade de Conímbriga (Doc. 3).', correct: false }, { id: 'B', text: 'À herança da língua latina (Doc. 4).', correct: false }, { id: 'C', text: 'Ao mapa das estradas do império (Doc. 5).', correct: true }, { id: 'D', text: 'À ponte romana de Chaves (Doc. 6).', correct: false } ], feedback: { correct: 'Exato! O documento 5 é um mapa que representa a vasta e complexa rede de estradas (vias) que os romanos construíram para ligar o seu império.', incorrect: 'A resposta correta é o mapa. A descrição fala de uma "rede de estradas que cobria o império", o que corresponde diretamente ao mapa (Doc. 5).' } } } },
            { id: 'modulo13', title: 'Módulo 11: Contagem de Séculos', icon: '⏳', color: 'from-violet-600 to-purple-700', content: { intro: 'Um bom historiador sabe situar os acontecimentos no tempo. Teste a sua habilidade em converter anos em séculos.', sections: [], activity: { type: 'problem', question: 'O Tratado de Zamora, que marcou o início de Portugal como reino independente, foi assinado em 1143. A que século corresponde este ano?', scenario: 'Compreender a contagem dos séculos é fundamental para organizar os eventos históricos. Lembre-se da regra: para anos depois de Cristo, some 1 aos dois primeiros dígitos (ou ao primeiro, se o ano tiver 3 dígitos), a não ser que termine em "00".', options: [ { id: 'A', text: 'Século X', correct: false }, { id: 'B', text: 'Século XI', correct: false }, { id: 'C', text: 'Século XII', correct: true }, { id: 'D', text: 'Século XIII', correct: false } ], feedback: { correct: 'Correto! O ano de 1143 pertence ao século XII. O século XII vai do ano 1101 ao ano 1200.', incorrect: 'A resposta correta é século XII. Para o ano 1143, olhamos para os dois primeiros dígitos (11) e somamos 1, o que dá 12.' } } } }
        ];

        const finalQuiz = [
            { id: 'q1', question: 'Qual a principal diferença entre as comunidades recoletoras e as agropastoris?', type: 'mcq', options: [ { id: 'A', text: 'Os recoletores usavam ferro e os agropastoris usavam bronze.' }, { id: 'B', text: 'Os recoletores eram nómadas e os agropastoris eram sedentários.' }, { id: 'C', text: 'Os recoletores construíam cromeleques e os agropastoris construíam cidades.' }, { id: 'D', text: 'Não existiam diferenças significativas.' } ], correct: 'B', feedback: { correct: 'Exato! A transição do nomadismo para o sedentarismo, graças à agricultura, é a diferença fundamental.', incorrect: 'Incorreto. A principal diferença foi a passagem de um estilo de vida nómada (recoletores) para um sedentário (agropastoris).' } },
            { id: 'q2', question: 'A conquista romana da Península Ibérica começou no século III a.C.', type: 'truefalse', options: [ {id: 'V', text: 'Verdadeiro'}, {id: 'F', text: 'Falso'} ], correct: 'V', feedback: { correct: 'Correto! A invasão começou em 218 a.C., que pertence ao século III a.C.', incorrect: 'Na verdade, é verdadeiro. O ano 218 a.C. marca o início da Segunda Guerra Púnica e da presença romana na Península.' } },
            { id: 'q3', question: 'O famoso líder da resistência lusitana contra os romanos chamava-se:', type: 'mcq', options: [ { id: 'A', text: 'César' }, { id: 'B', text: 'Aníbal' }, { id: 'C', text: 'Viriato' }, { id: 'D', text: 'Teodósio' } ], correct: 'C', feedback: { correct: 'Perfeito! Viriato, o pastor que se tornou general, é um grande símbolo da luta pela liberdade.', incorrect: 'A resposta correta é Viriato. Ele liderou os Lusitanos e foi um grande estratega militar.' } },
            { id: 'q4', question: 'Qual destes NÃO é um legado da cultura romana na Península Ibérica?', type: 'mcq', options: [ { id: 'A', text: 'A língua portuguesa.' }, { id: 'B', text: 'As bases do Direito.' }, { id: 'C', text: 'As construções megalíticas.' }, { id: 'D', text: 'A religião Cristã.' } ], correct: 'C', feedback: { correct: 'Isso mesmo! As construções megalíticas (antas, menires) são pré-históricas, muito anteriores à chegada dos romanos.', incorrect: 'Incorreto. As construções megalíticas são da pré-história. A língua, o direito e o cristianismo (que se tornou oficial no império) são legados romanos.' } },
            { id: 'q5', question: 'O imperador que tornou o Cristianismo a religião oficial do Império Romano foi...', type: 'mcq', options: [ { id: 'A', text: 'Constantino' }, { id: 'B', text: 'Teodósio' }, { id: 'C', text: 'Viriato' }, { id: 'D', text: 'César Augusto' } ], correct: 'B', feedback: { correct: 'Correto! Foi Teodósio, através do Édito de Salónica em 380. Constantino apenas concedeu liberdade de culto em 313.', incorrect: 'A resposta correta é Teodósio. Constantino foi importante porque concedeu a liberdade de culto aos cristãos, mas foi Teodósio que a tornou a religião oficial.' } },
            { id: 'q6', question: 'Um conjunto de menires dispostos em círculo, que funcionava como santuário, é chamado de:', type: 'mcq', options: [ { id: 'A', text: 'Anta' }, { id: 'B', text: 'Dólmen' }, { id: 'C', text: 'Castro' }, { id: 'D', text: 'Cromeleque' } ], correct: 'D', feedback: { correct: 'Exato! Os cromeleques são círculos de pedras erguidas, com funções religiosas ou astronómicas.', incorrect: 'A resposta correta é Cromeleque. Uma anta ou dólmen é um túmulo, e um castro é um povoado fortificado.' } },
            { id: 'q7', question: 'Os Iberos, que ocuparam o Sul e Leste da Península, eram especialistas a trabalhar com quais metais?', type: 'mcq', options: [ { id: 'A', text: 'Ouro e Ferro' }, { id: 'B', text: 'Cobre e Bronze' }, { id: 'C', text: 'Apenas Estanho' }, { id: 'D', text: 'Alumínio e Aço' } ], correct: 'B', feedback: { correct: 'Correto! Os Iberos tinham conhecimento da metalurgia do cobre e do bronze, metais importantes para ferramentas e armas antes da Idade do Ferro.', incorrect: 'Incorreto. Os Iberos eram conhecidos por trabalharem o cobre e a sua liga, o bronze. O ferro foi mais difundido pelos Celtas.' } },
            { id: 'q8', question: 'Os povoados fortificados que os Celtas construíam no alto dos montes chamavam-se:', type: 'mcq', options: [ { id: 'A', text: 'Vilas' }, { id: 'B', text: 'Cidades' }, { id: 'C', text: 'Castros' }, { id: 'D', text: 'Cromeleques' } ], correct: 'C', feedback: { correct: 'Isso mesmo! Os Castros são os povoados fortificados característicos da cultura celta e celtibera na Península Ibérica.', incorrect: 'A resposta correta é Castros. Eram povoados situados em locais altos para facilitar a defesa.' } },
            { id: 'q9', question: 'A língua que os romanos introduziram e que deu origem ao português foi o:', type: 'mcq', options: [ { id: 'A', text: 'Grego' }, { id: 'B', text: 'Latim' }, { id: 'C', text: 'Ibérico' }, { id: 'D', text: 'Celta' } ], correct: 'B', feedback: { correct: 'Perfeito! O Latim, a língua de Roma, é a base da língua portuguesa e de várias outras línguas europeias.', incorrect: 'A resposta correta é o Latim. É a herança linguística mais importante deixada pelos romanos.' } },
            { id: 'q10', question: 'Os romanos construíram uma vasta rede de estradas e pontes para facilitar o comércio e o movimento das suas tropas.', type: 'truefalse', options: [ {id: 'V', text: 'Verdadeiro'}, {id: 'F', text: 'Falso'} ], correct: 'V', feedback: { correct: 'Correto! A engenharia romana, especialmente as suas estradas, foi fundamental para manter o controlo e a coesão do vasto Império.', incorrect: 'Esta afirmação é verdadeira. A rede viária romana foi um dos pilares da sua administração e um fator crucial da romanização.' } }
        ];
        
        // --- APPLICATION STATE ---
        let appState = {
            page: 'intro', // 'intro', 'story', 'video', 'podcast', 'modules', 'module', 'quiz'
            storyPageIndex: 0,
            currentModuleIndex: null,
            moduleProgress: {}, // { moduleId: score_percentage }
            // ModuleDetail state
            activityAnswers: {}, // { 'problem': 'C', 'multiselect': ['A', 'B'], 'quiz': { q1: 'A', q2: 'C', ... } }
            currentModuleQuestionIndex: 0,
            showModuleFeedback: false,
            // Quiz state
            quizAnswers: {},
            showQuizFeedback: {},
            userName: '',
            showCertificate: false,
        };

        const root = document.getElementById('root');

        // --- NAVIGATION & RENDERING ---
        function navigateTo(newPage, data = null) {
            appState.page = newPage;
            
            // Reset activity state when navigating to modules or special pages
            if (newPage === 'module' || newPage === 'video' || newPage === 'podcast') {
                appState.activityAnswers = {};
                appState.currentModuleQuestionIndex = 0;
                appState.showModuleFeedback = false;
                
                if (newPage === 'module') {
                    appState.currentModuleIndex = data;
                } else {
                    appState.currentModuleIndex = null;
                }
            } else {
                appState.currentModuleIndex = null;
            }

            if(newPage === 'story') {
                appState.storyPageIndex = 0;
            }
             if(newPage === 'quiz') {
                appState.quizAnswers = {};
                appState.showQuizFeedback = {};
                appState.userName = '';
                appState.showCertificate = false;
            }
            window.scrollTo(0, 0);
            renderApp();
        }

        function renderApp() {
            let content = '';
            switch (appState.page) {
                case 'intro': content = renderIntro(); break;
                case 'story': content = renderStory(); break;
                case 'video': content = renderSpecialPage(videoData); break;
                case 'podcast': content = renderSpecialPage(podcastData); break;
                case 'modules': content = renderModuleList(); break;
                case 'module': content = renderModuleDetail(); break;
                case 'quiz': content = renderQuiz(); break;
                default: content = renderIntro();
            }
            root.innerHTML = renderNavbar() + `<main class="pt-20 fade-in">${content}</main>`;
        }
        
        // --- COMPONENT RENDER FUNCTIONS ---
        function renderNavbar() {
            const navLink = (pageName, text, activePages = []) => {
                const isActive = appState.page === pageName || activePages.includes(appState.page);
                const activeClass = "text-amber-700 font-bold border-b-2 border-amber-600";
                const inactiveClass = "text-gray-600 hover:text-amber-700 transition-colors";
                return `
                    <li>
                        <button onclick="navigateTo('${pageName}')" class="px-3 py-2 text-lg font-medium ${isActive ? activeClass : inactiveClass}" aria-current="${isActive ? 'page' : 'false'}">
                            ${text}
                        </button>
                    </li>
                `;
            };
            return `
                <header class="fixed top-0 left-0 right-0 bg-white/90 backdrop-blur-md shadow-md z-40">
                    <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between items-center h-20">
                            <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('intro')">
                                <span class="text-4xl" aria-hidden="true">🏛️</span>
                                <span class="font-bold text-2xl text-amber-800">Península Ibérica</span>
                            </div>
                            <ul class="hidden md:flex items-center space-x-6">
                                ${navLink('intro', 'Início')}
                                ${navLink('story', 'A Viagem')}
                                ${navLink('video', 'Vídeo')}
                                ${navLink('podcast', 'Podcast')}
                                ${navLink('modules', 'Módulos', ['module'])}
                                ${navLink('quiz', 'Questionário')}
                            </ul>
                        </div>
                    </nav>
                </header>
            `;
        }

        function renderFooter() {
            return `
                <footer class="bg-gradient-to-r from-amber-900 to-yellow-900 text-white py-6 mt-12">
                    <div class="max-w-6xl mx-auto px-4 text-center">
                        <p class="text-lg font-medium">Teodósio Faria©2025 Primeiros Povos da Península Ibérica - das origens à romanização</p>
                    </div>
                </footer>
            `;
        }
        
        function renderImageWithPlaceholder(src, alt) {
            return `<div class="w-full h-full cursor-zoom-in" onclick="toggleZoomModal('${src}')"><img src="${src}" alt="${alt}" class="w-full h-full object-cover" loading="lazy" /></div>`;
        }

        function renderIntro() {
            return `
                <div class="min-h-screen bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50 p-8 flex items-center justify-center">
                    <div class="max-w-4xl mx-auto text-center">
                        <h1 class="text-5xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-600 to-yellow-700 mb-4">Primeiros Povos da Península Ibérica</h1>
                        <p class="text-lg md:text-xl text-gray-600 mb-12">Uma jornada interativa das origens à romanização.</p>
                        <div class="bg-white rounded-2xl shadow-2xl p-8 mb-8 text-left">
                            <p class="text-lg text-gray-700 leading-relaxed mb-6">Este percurso educativo convida-o a explorar as fundações da história da Península Ibérica. Descubra como viviam as primeiras comunidades, quem eram os povos que habitavam estas terras antes da chegada de Roma, e como o Império Romano moldou para sempre a cultura, a língua e a sociedade da região.</p>
                        </div>
                        <div class="space-y-6">
                            <button onclick="navigateTo('story')" class="w-full max-w-xs px-8 py-4 bg-gradient-to-r from-amber-600 to-yellow-700 text-white text-xl font-bold rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition">Começar a Viagem</button>
                        </div>
                    </div>
                </div>
                ${renderFooter()}
            `;
        }

        function renderStory() {
            const page = storyPages[appState.storyPageIndex];
            const isLastPage = appState.storyPageIndex === storyPages.length - 1;
            const isFirstPage = appState.storyPageIndex === 0;

            return `
                <div class="min-h-screen bg-gradient-to-br from-amber-50 to-yellow-50 p-4 sm:p-8">
                    <div class="max-w-6xl w-full mx-auto">
                        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
                            <div class="bg-gradient-to-r from-amber-600 to-yellow-700 p-4 sm:p-6 text-white">
                                <h2 class="text-2xl sm:text-3xl font-bold">Uma Viagem no Tempo</h2>
                                <p class="text-amber-100 mt-1 text-sm sm:text-base">Capítulo ${appState.storyPageIndex + 1}: ${page.title}</p>
                            </div>
                            <div class="p-4 sm:p-8">
                                <div class="grid md:grid-cols-2 gap-6 mb-8">
                                    <div class="bg-gray-200 rounded-xl overflow-hidden h-64 md:h-[60vh] flex items-center justify-center shadow-lg">
                                        ${renderImageWithPlaceholder(page.image, page.title)}
                                    </div>
                                    <div class="flex items-start">
                                        <div class="bg-gradient-to-br from-amber-50 to-yellow-50 p-6 rounded-xl border-2 border-amber-200 shadow-md w-full max-h-[60vh] overflow-y-auto custom-scrollbar">
                                            <p class="text-base sm:text-lg leading-relaxed text-gray-800">${page.text}</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center flex-wrap gap-4 pt-4 border-t-2 border-gray-200">
                                    <button onclick="handleStoryNav('prev')" ${isFirstPage ? 'disabled' : ''} class="flex items-center gap-2 px-6 py-3 bg-amber-600 text-white rounded-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-amber-700 transition shadow-md">← Anterior</button>
                                    <span class="text-gray-600 font-medium">Página ${appState.storyPageIndex + 1} de ${storyPages.length}</span>
                                    ${!isLastPage ? 
                                        `<button onclick="handleStoryNav('next')" class="flex items-center gap-2 px-6 py-3 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition shadow-md">Próxima →</button>` :
                                        `<button onclick="navigateTo('video')" class="flex items-center gap-2 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition shadow-md">Ver Vídeo →</button>`
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                ${renderFooter()}
            `;
        }
        
        function renderModuleList() {
            const completedModules = Object.values(appState.moduleProgress).filter(score => score > 0).length;

            return `
                <div class="min-h-screen bg-gradient-to-br from-slate-50 to-gray-100 p-4 sm:p-8">
                    <div class="max-w-6xl mx-auto">
                        <div class="text-center mb-12">
                            <h2 class="text-4xl font-bold text-gray-800 mb-4">Módulos de Aprendizagem</h2>
                            <p class="text-xl text-gray-600">Escolha um módulo para começar a explorar</p>
                             ${completedModules > 0 ? `
                                <div class="mt-6 inline-block bg-white rounded-xl shadow-lg p-6">
                                    <p class="text-lg font-semibold text-gray-700 mb-2">
                                        ${completedModules} de ${modules.length} módulos concluídos
                                    </p>
                                </div>` : ''
                            }
                        </div>
                        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                            ${modules.map((module, idx) => {
                                const scorePercentage = appState.moduleProgress[module.id] || 0;
                                const isCompleted = scorePercentage === 100;
                                const isStarted = scorePercentage > 0;
                                const progressText = isCompleted ? 'Concluído' : (isStarted ? `${scorePercentage}%` : 'Não iniciado');
                                const progressTextColor = isCompleted ? 'text-green-600' : 'text-gray-500';

                                return `
                                    <div onclick="navigateTo('module', ${idx})" class="bg-white rounded-xl shadow-lg hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-300 cursor-pointer overflow-hidden flex flex-col">
                                        <div class="bg-gradient-to-r ${module.color} p-6 text-white">
                                            <div class="flex items-center gap-3">
                                                <span class="text-3xl" title="${module.title}">${module.icon}</span>
                                                <span class="text-2xl font-bold">Módulo ${idx + 1}</span>
                                            </div>
                                        </div>
                                        <div class="p-6 flex-grow flex flex-col">
                                            <h3 class="text-xl font-bold text-gray-800 mb-3">${module.title.split(': ')[1]}</h3>
                                            <p class="text-gray-600 flex-grow mb-4">${module.content.intro}</p>
                                            <div class="mt-auto pt-4 border-t border-gray-200">
                                                <p class="text-sm font-semibold mb-2">Progresso: <span class="${progressTextColor}">${progressText}</span></p>
                                                <div class="w-full bg-gray-200 rounded-full h-2.5">
                                                    <div class="bg-green-600 h-2.5 rounded-full transition-all duration-500" style="width: ${scorePercentage}%"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div class="text-center">
                            <button onclick="navigateTo('quiz')" class="px-8 py-4 bg-gradient-to-r from-green-600 to-emerald-700 text-white text-xl font-bold rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition inline-flex items-center gap-3">🏆 Questionário Final</button>
                        </div>
                    </div>
                </div>
                ${renderFooter()}
            `;
        }

        // Reusable activity renderer for Modules, Video and Podcast pages
        function renderActivityUI(activity, isCompleted, contextId) {
             const renderFeedback = (question) => {
                if (!appState.showModuleFeedback && activity.type !== 'quiz') return '';
                
                let isCorrect;
                let feedbackText;
                const answer = (appState.activityAnswers.quiz || {})[question.id];

                if (activity.type === 'problem' || activity.type === 'multiselect') {
                    const allAnswers = appState.activityAnswers[activity.type] || (activity.type === 'multiselect' ? [] : null);
                    isCorrect = checkModuleAnswer(activity, allAnswers);
                    feedbackText = isCorrect ? activity.feedback.correct : activity.feedback.incorrect;
                } else if (activity.type === 'quiz') {
                    if (answer === undefined) return ''; // No feedback for this specific question yet
                    
                    if (question.type === 'fill_blank') {
                        isCorrect = answer.trim().toLowerCase() === question.correct.trim().toLowerCase();
                    } else { // mcq, true_false, image_mcq
                        isCorrect = answer === question.options.find(o => o.correct)?.id;
                    }
                    feedbackText = isCorrect ? question.feedback.correct : question.feedback.incorrect;
                }

                if (isCorrect === undefined) return '';

                const feedbackClass = isCorrect ? 'bg-green-100 border-green-500 text-green-800' : 'bg-red-100 border-red-500 text-red-800';
                const feedbackIcon = isCorrect ? '✅' : '❌';
                const feedbackTitle = isCorrect ? 'Muito bem!' : 'Resposta incorreta.';
                
                return `
                    <div class="mt-4 p-4 rounded-lg border-l-4 ${feedbackClass} fade-in">
                        <p class="font-bold">${feedbackIcon} ${feedbackTitle}</p>
                        <p class="mt-2">${feedbackText}</p>
                    </div>
                `;
            };

            const activityContent = () => {
                const isDisabled = appState.showModuleFeedback || isCompleted;

                switch (activity.type) {
                    case 'problem':
                        return `
                            <p class="text-xl font-semibold mb-3">${activity.question}</p>
                            ${activity.scenario ? `<div class="bg-amber-50 p-4 rounded-lg mb-6 border-l-4 border-amber-500"><p class="text-gray-700 italic">${activity.scenario}</p></div>` : ''}
                            <div class="space-y-3">
                                ${activity.options.map(option => `
                                    <button onclick="handleActivityAnswer('${activity.type}', '${option.id}')" 
                                        ${isDisabled ? 'disabled' : ''} 
                                        class="w-full text-left p-4 rounded-lg border-2 transition disabled:opacity-70 
                                        ${appState.activityAnswers['problem'] === option.id && !appState.showModuleFeedback ? 'ring-2 ring-blue-500' : ''}
                                        ${appState.showModuleFeedback && option.correct ? 'border-green-500 bg-green-50' : ''}
                                        ${appState.showModuleFeedback && !option.correct && appState.activityAnswers['problem'] === option.id ? 'border-red-500 bg-red-50' : ''}
                                        ${!appState.showModuleFeedback && !isCompleted ? 'border-gray-300 hover:border-blue-500' : 'border-gray-300'}">
                                        <span class="font-bold">${option.id}.</span> ${option.text}
                                    </button>
                                `).join('')}
                            </div>
                            ${!isDisabled ? '<button onclick="handleModuleSubmit()" class="mt-6 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold">Submeter Resposta</button>' : ''}
                            ${renderFeedback(activity)}
                        `;
                    case 'multiselect':
                            const selectedAnswers = appState.activityAnswers['multiselect'] || [];
                            return `
                            <p class="text-xl font-semibold mb-3">${activity.question}</p>
                            ${activity.scenario ? `<div class="bg-amber-50 p-4 rounded-lg mb-6 border-l-4 border-amber-500"><p class="text-gray-700 italic">${activity.scenario}</p></div>` : ''}
                            <div class="space-y-3">
                                ${activity.options.map(option => {
                                    const isSelected = selectedAnswers.includes(option.id);
                                    let feedbackClass = 'border-gray-300';
                                    if (appState.showModuleFeedback) {
                                        if (option.correct) {
                                            feedbackClass = 'border-green-500 bg-green-50';
                                        } else if (isSelected && !option.correct) {
                                            feedbackClass = 'border-red-500 bg-red-50';
                                        }
                                    } else if (!isCompleted) {
                                        feedbackClass += ' hover:border-blue-500';
                                    }
                                    
                                    return `
                                    <button onclick="handleActivityAnswer('${activity.type}', '${option.id}')" 
                                        ${isDisabled ? 'disabled' : ''} 
                                        class="w-full text-left p-4 rounded-lg border-2 transition disabled:opacity-70 flex items-center gap-3 ${feedbackClass} ${isSelected && !appState.showModuleFeedback ? 'ring-2 ring-blue-500' : ''}">
                                        <div class="w-6 h-6 border-2 ${isSelected ? 'bg-blue-600 border-blue-600' : 'border-gray-400'} rounded-md flex items-center justify-center text-white flex-shrink-0">
                                            ${isSelected ? '✓' : ''}
                                        </div>
                                        <span><span class="font-bold">${option.id}.</span> ${option.text}</span>
                                    </button>
                                `}).join('')}
                            </div>
                            ${!isDisabled ? '<button onclick="handleModuleSubmit()" class="mt-6 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold">Submeter Resposta</button>' : ''}
                            ${renderFeedback(activity)}
                        `;
                    case 'quiz':
                        const currentQuestion = activity.questions[appState.currentModuleQuestionIndex];
                        const currentAnswer = (appState.activityAnswers.quiz || {})[currentQuestion.id];
                        const isLastQuestion = appState.currentModuleQuestionIndex === activity.questions.length - 1;
                        const showSubmitButton = isLastQuestion && currentAnswer && !appState.showModuleFeedback;

                        const renderQuizQuestion = (question) => {
                            const isDisabled = currentAnswer !== undefined;
                            switch(question.type) {
                                case 'image_mcq':
                                    return `
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            ${question.options.map(option => `
                                                <button onclick="handleActivityAnswer('quiz', '${option.id}', '${question.id}')" 
                                                        ${isDisabled ? 'disabled' : ''} 
                                                        class="border-2 rounded-lg overflow-hidden transition disabled:opacity-70 focus:outline-none focus:ring-2 focus:ring-blue-500
                                                        ${isDisabled && option.correct ? 'border-green-500 ring-2 ring-green-500' : ''}
                                                        ${isDisabled && !option.correct && currentAnswer === option.id ? 'border-red-500 ring-2 ring-red-500' : ''}
                                                        ${!isDisabled ? 'border-gray-300 hover:border-blue-500' : 'border-transparent'}">
                                                    <img src="${option.img}" alt="${option.text}" class="w-full h-40 object-cover bg-gray-200">
                                                    <p class="p-3 font-semibold text-center bg-gray-50">${option.text}</p>
                                                </button>
                                            `).join('')}
                                        </div>
                                    `;
                                case 'true_false':
                                    return `
                                        <div class="flex gap-4 justify-center">
                                            ${question.options.map(option => `
                                                <button onclick="handleActivityAnswer('quiz', '${option.id}', '${question.id}')" 
                                                        ${isDisabled ? 'disabled' : ''} 
                                                        class="w-full sm:w-48 p-4 rounded-lg border-2 font-bold text-lg transition disabled:opacity-70
                                                        ${isDisabled && option.correct ? 'border-green-500 bg-green-50 text-green-800' : ''}
                                                        ${isDisabled && !option.correct && currentAnswer === option.id ? 'border-red-500 bg-red-50 text-red-800' : ''}
                                                        ${!isDisabled ? 'border-gray-300 hover:border-blue-500 hover:bg-blue-50' : 'border-gray-300'}">
                                                    ${option.text}
                                                </button>
                                            `).join('')}
                                        </div>
                                    `;
                                case 'fill_blank':
                                    const blank = `<input type="text" id="fill-blank-${question.id}" 
                                                            class="inline-block w-48 mx-2 p-1 text-center border-b-2 border-gray-400 focus:border-blue-500 focus:outline-none bg-transparent rounded-sm text-lg"
                                                            ${isDisabled ? 'disabled' : ''} value="${currentAnswer || ''}">`;
                                    return `
                                        <div class="text-center text-xl">
                                            <p>${question.question.replace('______', blank)}</p>
                                        </div>
                                    `;
                                case 'mcq':
                                default:
                                    return `
                                        <div class="space-y-3">
                                                ${question.options.map(option => `
                                                <button onclick="handleActivityAnswer('quiz', '${option.id}', '${question.id}')" 
                                                    ${isDisabled ? 'disabled' : ''} 
                                                    class="w-full text-left p-4 rounded-lg border-2 transition disabled:opacity-70 
                                                        ${isDisabled && !option.correct && currentAnswer === option.id ? 'border-red-500 bg-red-50' : ''}
                                                        ${isDisabled && option.correct ? 'border-green-500 bg-green-50' : ''}
                                                        ${!isDisabled ? 'border-gray-300 hover:border-blue-500' : 'border-gray-300'}">
                                                    <span class="font-bold">${option.id}.</span> ${option.text}
                                                </button>
                                            `).join('')}
                                        </div>
                                    `;
                            }
                        };
                        return `
                            <div class="mb-4">
                                <p class="text-sm font-bold text-gray-500">Pergunta ${appState.currentModuleQuestionIndex + 1} de ${activity.questions.length}</p>
                                <p class="text-xl font-semibold">${currentQuestion.question}</p>
                            </div>
                            ${renderQuizQuestion(currentQuestion)}
                            ${currentAnswer !== undefined ? renderFeedback(currentQuestion) : ''}

                            <div class="mt-6 flex justify-end">
                                ${currentQuestion.type === 'fill_blank' && !currentAnswer ? `<button onclick="checkFillBlankAnswer('quiz', '${currentQuestion.id}')" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold">Verificar</button>` : ''}
                                ${!isLastQuestion && currentAnswer ? `<button onclick="nextModuleQuestion()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold">Próxima Pergunta →</button>` : ''}
                                ${showSubmitButton ? `<button onclick="handleModuleSubmit()" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-semibold">Finalizar Atividade</button>` : ''}
                            </div>
                        `;
                    default: return 'Atividade não implementada.';
                }
            };

            return `
                <div>
                    ${activity.image ? `
                        <div class="mb-6 rounded-lg overflow-hidden h-56 bg-gray-200 shadow-md">
                            ${renderImageWithPlaceholder(activity.image, 'Imagem da atividade')}
                        </div>
                    ` : ''}
                    ${activityContent()}
                </div>
            `;
        }

        function renderSpecialPage(data) {
            // This works for Video or Podcast pages
            const activity = data.content.activity;
            // We don't track global progress for these special pages in the same way as numbered modules
            const isCompleted = appState.showModuleFeedback;

            return `
                <div class="min-h-screen bg-gradient-to-br from-slate-50 to-gray-100 p-4 sm:p-8">
                    <div class="max-w-4xl mx-auto">

                            <div class="bg-gradient-to-r ${data.color} p-6 text-white">
                                 <div class="flex items-center gap-4">
                                    <span class="text-4xl">${data.icon}</span>
                                    <div><h2 class="text-3xl font-bold">${data.title}</h2><p class="text-white/90 mt-1">${data.content.intro}</p></div>

                            </div>
                            <div class="p-6 sm:p-8">
                                ${data.content.media ? `
                                    <div class="mb-8">
                                        ${data.content.media.type === 'video' ? `
                                            <video controls class="w-full rounded-lg shadow-lg bg-black">
                                                <source src="${data.content.media.src}" type="video/mp4">
