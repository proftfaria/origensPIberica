                                        `;
                                    case 'mcq':
                                    default:
                                        return `
                                            <div class="space-y-3">
                                                 ${question.options.map(option => `
                                                    <button onclick="handleActivityAnswer('quiz', '${option.id}', '${question.id}')" 
                                                        ${isDisabled ? 'disabled' : ''} 
                                                        class="w-full text-left p-4 rounded-lg border-2 transition disabled:opacity-70 
                                                            ${isDisabled && !option.correct && currentAnswer === option.id ? 'border-red-500 bg-red-50' : ''}
                                                            ${isDisabled && option.correct ? 'border-green-500 bg-green-50' : ''}
                                                            ${!isDisabled ? 'border-gray-300 hover:border-blue-500' : 'border-gray-300'}">
                                                        <span class="font-bold">${option.id}.</span> ${option.text}
                                                    </button>
                                                `).join('')}
                                            </div>
                                        `;
                                }
                            };
                            return `
                                <div class="mb-4">
                                    <p class="text-sm font-bold text-gray-500">Pergunta ${appState.currentModuleQuestionIndex + 1} de ${activity.questions.length}</p>
                                    <p class="text-xl font-semibold">${currentQuestion.question}</p>
                                </div>
                                ${renderQuizQuestion(currentQuestion)}
                                ${currentAnswer !== undefined ? renderFeedback(currentQuestion) : ''}

                                <div class="mt-6 flex justify-end">
                                    ${currentQuestion.type === 'fill_blank' && !currentAnswer ? `<button onclick="checkFillBlankAnswer('quiz', '${currentQuestion.id}')" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold">Verificar</button>` : ''}
                                    ${!isLastQuestion && currentAnswer ? `<button onclick="nextModuleQuestion()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold">Próxima Pergunta →</button>` : ''}
                                    ${showSubmitButton ? `<button onclick="handleModuleSubmit()" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-semibold">Finalizar Módulo</button>` : ''}
                                </div>
                            `;
                        default: return 'Atividade não implementada.';
                    }
                };

                return `
                    <div>
                        ${activity.image ? `
                            <div class="mb-6 rounded-lg overflow-hidden h-56 bg-gray-200 shadow-md">
                                ${renderImageWithPlaceholder(activity.image, 'Imagem da atividade')}
                            </div>
                        ` : ''}
                        ${activityContent()}
                    </div>
                `;
            };

            return `
                <div class="min-h-screen bg-gradient-to-br from-slate-50 to-gray-100 p-4 sm:p-8">
                    <div class="max-w-4xl mx-auto">
                        <button onclick="navigateTo('modules')" class="mb-6 px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg flex items-center gap-2 transition">← Voltar aos Módulos</button>
                        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
                            <div class="bg-gradient-to-r ${module.color} p-6 text-white">
                                 <div class="flex items-center gap-4">
                                    <span class="text-4xl">${module.icon}</span>
                                    <div><h2 class="text-3xl font-bold">${module.title}</h2><p class="text-white/90 mt-1">${module.content.intro}</p></div>
                                </div>
                            </div>
                            <div class="p-6 sm:p-8">
                                ${module.content.media ? `
                                    <div class="mb-8">
                                        ${module.content.media.type === 'video' ? `
                                            <video controls class="w-full rounded-lg shadow-lg bg-black">
                                                <source src="${module.content.media.src}" type="video/mp4">
                                                O seu navegador não suporta o elemento de vídeo.
                                            </video>
                                        ` : ''}
                                        ${module.content.media.type === 'audio' ? `
                                            <audio controls class="w-full">
                                                <source src="${module.content.media.src}" type="audio/mpeg">
                                                O seu navegador não suporta o elemento de áudio.
                                            </audio>
                                        ` : ''}
                                    </div>
                                ` : ''}
                                ${module.content.sections.map(section => `
                                    <div class="mb-8">
                                        <h3 class="text-2xl font-bold text-gray-800 mb-4">${section.title}</h3>
                                        ${section.text ? `<p class="text-gray-700 leading-relaxed mb-4">${section.text}</p>` : ''}
                                        ${section.items ? `<div class="space-y-3">${section.items.map(item => `
                                            <div class="flex items-start gap-3 bg-gray-50 p-4 rounded-lg">
                                                ${item.emoji ? `<span class="text-2xl mt-1">${item.emoji}</span>` : ''}
                                                <div class="flex-1">
                                                    ${item.title ? `<span class="font-bold text-gray-800">${item.title}: </span>` : ''}
                                                    <span class="text-gray-700">${item.text}</span>
                                                </div>
                                            </div>`).join('')}</div>` : ''}
                                    </div>`).join('')}
                                 <div class="mt-12 bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl p-6 sm:p-8 border-2 border-blue-200">
                                    <h3 class="text-2xl font-bold text-blue-900 mb-4">🎯 Atividade Interativa</h3>
                                    ${renderActivity()}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                ${renderFooter()}
            `;
        }

        function renderQuiz() {
             if (appState.showCertificate) {
                const totalModuleScore = Object.values(appState.moduleProgress).reduce((sum, score) => sum + (Number(score) || 0), 0);
                const maxModuleScore = modules.length * 100;
                const correctQuizAnswersCount = finalQuiz.filter(q => checkQuizAnswer(q)).length;
                const quizScore = Math.round((correctQuizAnswersCount / finalQuiz.length) * 100);
                
                const finalPercentage = Math.round(((totalModuleScore / maxModuleScore * 0.7) + (quizScore / 100 * 0.3)) * 100);

                return `
                    <div class="min-h-screen bg-gray-100 p-8 flex items-center justify-center">
                        <div class="max-w-4xl w-full text-center fade-in">
                            <div class="bg-white rounded-2xl shadow-2xl p-8 sm:p-12 border-4 border-amber-500 bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')]">
                                <h2 class="text-4xl font-bold text-amber-800 mb-2">Certificado de Conclusão</h2>
                                <p class="text-gray-600 mb-8">Viagem pela História da Península Ibérica</p>
                                <p class="text-lg text-gray-700 mb-4">Este certificado é concedido a</p>
                                <p class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-700 to-yellow-800 mb-8 pb-2 border-b-2 border-amber-300 inline-block">${appState.userName}</p>
                                <p class="text-lg text-gray-700 mb-6">pela conclusão bem-sucedida do percurso com uma pontuação final de:</p>
                                <div class="text-7xl font-bold text-amber-600 mb-10">${finalPercentage}%</div>
                                 <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left mb-8">
                                    <div class="bg-amber-50 p-4 rounded-lg"><p class="font-bold text-gray-700">Pontuação Média dos Módulos:</p><p class="text-xl text-amber-700">${Math.round(totalModuleScore / modules.length)}%</p></div>
                                    <div class="bg-amber-50 p-4 rounded-lg"><p class="font-bold text-gray-700">Pontuação do Questionário:</p><p class="text-xl text-amber-700">${quizScore}%</p></div>
                                </div>
                                <p class="text-gray-500 text-sm">Emitido em: ${new Date().toLocaleDateString('pt-PT')}</p>
                                <div class="mt-10 pt-6 border-t border-amber-300 flex items-center justify-center gap-4 text-left">
                                    <span class="text-5xl" aria-hidden="true">🗿</span>
                                    <div>
                                        <p class="font-bold text-amber-800">Selo de Conhecimento</p>
                                        <p class="text-sm text-gray-600">História da Península Ibérica</p>
                                    </div>
                                </div>
                            </div>
                            <button onclick="window.location.reload()" class="mt-8 px-8 py-4 bg-gray-600 text-white rounded-xl hover:bg-gray-700 transition">Recomeçar</button>
                        </div>
                    </div>
                    ${renderFooter()}
                `;
            }

            const allAnswered = Object.keys(appState.showQuizFeedback).length === finalQuiz.length;

            return `
                <div class="min-h-screen bg-gradient-to-br from-slate-50 to-gray-100 p-4 sm:p-8">
                    <div class="max-w-4xl mx-auto">
                        <button onclick="navigateTo('modules')" class="mb-6 px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg flex items-center gap-2 transition">← Voltar aos Módulos</button>
                        <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8">
                            <h2 class="text-4xl font-bold text-gray-800 mb-4 text-center">🏆 Questionário Final</h2>
                            <p class="text-xl text-gray-600 mb-10 text-center">Teste os seus conhecimentos.</p>
                            <div class="space-y-8">
                                ${finalQuiz.map((q, idx) => `
                                    <div class="bg-gray-50 p-6 rounded-xl border-l-4 border-amber-500">
                                        <p class="text-lg font-semibold text-gray-800 mb-4">${idx + 1}. ${q.question}</p>
                                        ${q.type === 'mcq' ? `
                                            <div class="space-y-2">${(q.options || []).map(opt => `
                                                <button onclick="handleQuizAnswer('${q.id}', '${opt.id}')" ${appState.showQuizFeedback[q.id] ? 'disabled' : ''} class="w-full text-left p-3 rounded-lg border-2 transition disabled:opacity-80 ${
                                                    appState.showQuizFeedback[q.id] && opt.id === q.correct ? 'border-green-500 bg-green-100' :
                                                    appState.showQuizFeedback[q.id] && opt.id !== q.correct && appState.quizAnswers[q.id] === opt.id ? 'border-red-500 bg-red-100' :
                                                    'border-gray-300 hover:border-blue-500 hover:bg-blue-50'
                                                }"><span class="font-bold">${opt.id}.</span> ${opt.text}</button>
                                            `).join('')}</div>
                                        ` : ''}
                                        ${q.type === 'truefalse' ? `
                                            <div class="flex gap-4">${(q.options || []).map(opt => `
                                                <button onclick="handleQuizAnswer('${q.id}', '${opt.id}')" ${appState.showQuizFeedback[q.id] ? 'disabled' : ''} class="flex-1 p-3 rounded-lg border-2 font-bold transition disabled:opacity-80 ${
                                                    appState.showQuizFeedback[q.id] && opt.id === q.correct ? 'border-green-500 bg-green-100' :
                                                    appState.showQuizFeedback[q.id] && opt.id !== q.correct && appState.quizAnswers[q.id] === opt.id ? 'border-red-500 bg-red-100' :
                                                    'border-gray-300 hover:border-blue-500 hover:bg-blue-50'
                                                }">${opt.text}</button>
                                            `).join('')}</div>
                                        ` : ''}
                                        ${appState.showQuizFeedback[q.id] ? `
                                            <div class="mt-4 p-3 rounded-lg ${checkQuizAnswer(q) ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                                <p><span class="font-bold">${checkQuizAnswer(q) ? '✓' : '✗'}</span> ${checkQuizAnswer(q) ? q.feedback.correct : q.feedback.incorrect}</p>
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                            ${allAnswered ? `
                                <div class="mt-12 text-center bg-gradient-to-r from-amber-50 to-yellow-100 p-8 rounded-2xl border-2 border-amber-300">
                                    <h3 class="text-2xl font-bold text-gray-800 mb-2">Parabéns, concluiu o questionário!</h3>
                                    <p class="text-gray-700 mb-6">Insira o seu nome para gerar o seu certificado.</p>
                                    <input type="text" value="${appState.userName}" oninput="appState.userName = this.value" placeholder="O seu nome completo" class="w-full max-w-md mx-auto p-4 border-2 border-amber-400 rounded-lg text-center text-lg focus:ring-2 focus:ring-amber-500" />
                                    <button onclick="handleGenerateCertificate()" class="mt-6 px-8 py-4 bg-gradient-to-r from-amber-600 to-yellow-700 text-white text-xl font-bold rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition">Gerar Certificado</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
                ${renderFooter()}
            `;
        }

        // --- EVENT HANDLERS & LOGIC ---
        function toggleZoomModal(src) {
            const modal = document.getElementById('zoom-modal');
            const img = document.getElementById('zoomed-image');
            if (src && modal && img) {
                img.src = src;
                modal.classList.add('active');
            } else if (modal) {
                modal.classList.remove('active');
                img.src = ''; // Clear src to avoid showing old image briefly
            }
        }
        
        function handleStoryNav(direction) {
            if (direction === 'next' && appState.storyPageIndex < storyPages.length - 1) {
                appState.storyPageIndex++;
            } else if (direction === 'prev' && appState.storyPageIndex > 0) {
                appState.storyPageIndex--;
            }
            renderApp();
        }

        function handleActivityAnswer(type, answer, questionId = null) {
            if (type === 'problem') {
                appState.activityAnswers['problem'] = answer;
            } else if (type === 'multiselect') {
                if (!appState.activityAnswers['multiselect']) {
                    appState.activityAnswers['multiselect'] = [];
                }
                const currentAnswers = appState.activityAnswers['multiselect'];
                const index = currentAnswers.indexOf(answer);
                if (index > -1) {
                    currentAnswers.splice(index, 1); // Deselect
                } else {
                    currentAnswers.push(answer); // Select
                }
            } else if (type === 'quiz' && questionId) {
                 if (!appState.activityAnswers.quiz) {
                    appState.activityAnswers.quiz = {};
                }
                appState.activityAnswers.quiz[questionId] = answer;
            }
            renderApp();
        }
        
        function checkFillBlankAnswer(type, questionId) {
            const input = document.getElementById(`fill-blank-${questionId}`);
            if (input) {
                handleActivityAnswer(type, input.value, questionId);
            }
        }

        function nextModuleQuestion() {
            const module = modules[appState.currentModuleIndex];
            if (appState.currentModuleQuestionIndex < module.content.activity.questions.length - 1) {
                appState.currentModuleQuestionIndex++;
                renderApp();
            }
        }
        
        function checkModuleAnswer(activity, answer) {
            if (activity.type === 'problem') {
                const selectedOption = activity.options.find(opt => opt.id === answer);
                return selectedOption?.correct === true;
            } else if (activity.type === 'multiselect') {
                const correctAnswers = activity.correct;
                const sortedSelected = [...(answer || [])].sort();
                const sortedCorrect = [...correctAnswers].sort();
                return sortedSelected.length === sortedCorrect.length && sortedSelected.every((value, index) => value === sortedCorrect[index]);
            }
            return false;
        }

        function handleModuleSubmit() {
            const module = modules[appState.currentModuleIndex];
            if (!module || appState.showModuleFeedback) return;
            
            appState.showModuleFeedback = true;
            
            let score = 0;
            const activity = module.content.activity;

            if (activity.type === 'problem' || activity.type === 'multiselect') {
                const allAnswers = appState.activityAnswers[activity.type];
                if (checkModuleAnswer(activity, allAnswers)) {
                    score = 100;
                }
            } else if (activity.type === 'quiz') {
                let correctCount = 0;
                const userAnswers = appState.activityAnswers.quiz || {};
                activity.questions.forEach(q => {
                    const userAnswer = userAnswers[q.id];
                    if (!userAnswer) return;

                    if (q.type === 'fill_blank') {
                        if (userAnswer.trim().toLowerCase() === q.correct.trim().toLowerCase()) {
                            correctCount++;
                        }
                    } else { // mcq, true_false, image_mcq
                        const correctOptionId = q.options.find(opt => opt.correct)?.id;
                        if (userAnswer === correctOptionId) {
                            correctCount++;
                        }
                    }
                });
                score = Math.round((correctCount / activity.questions.length) * 100);
            }
            
            appState.moduleProgress[module.id] = score;
            renderApp();
        }

        function handleQuizAnswer(questionId, answer) {
            if (!answer || appState.showQuizFeedback[questionId]) return;
            appState.quizAnswers[questionId] = answer;
            appState.showQuizFeedback[questionId] = true;
            renderApp();
        }

        function checkQuizAnswer(question) {
            const answer = appState.quizAnswers[question.id];
            if (!answer) return false;
            return answer.toLowerCase().trim() === question.correct.toLowerCase().trim();
        }

        function handleGenerateCertificate() {
            if (appState.userName.trim() !== "") {
                appState.showCertificate = true;
                renderApp();
            } else {
                alert("Por favor, insira o seu nome para gerar o certificado.");
            }
        }

        // --- INITIAL RENDER ---
        document.addEventListener('DOMContentLoaded', renderApp);

    </script>
</body>
</html>
